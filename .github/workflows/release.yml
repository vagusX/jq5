name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: jq5-linux-x86_64
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: jq5-linux-aarch64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            name: jq5-darwin-x86_64
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            name: jq5-darwin-aarch64
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: jq5-windows-x86_64
            cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (x86_64 Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz jq5
          cd ../../..
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Package deb (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          ARCH=${{ matrix.target }}
          if [[ "$ARCH" == *"x86_64"* ]]; then DEB_ARCH="amd64"; fi
          if [[ "$ARCH" == *"aarch64"* ]]; then DEB_ARCH="arm64"; fi
          VERSION=${GITHUB_REF_NAME#v}
          PKG_DIR="jq5_${VERSION}_${DEB_ARCH}"
          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin"
          cp target/${{ matrix.target }}/release/jq5 "${PKG_DIR}/usr/bin/"
          cat > "${PKG_DIR}/DEBIAN/control" << EOF
          Package: jq5
          Version: ${VERSION}
          Architecture: ${DEB_ARCH}
          Maintainer: vagusX <vagusxl@gmail.com>
          Depends: jq
          Description: An extension of jq to work on JSON5 files, preserving comments
          Homepage: https://github.com/vagusX/jq5
          EOF
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/control"
          dpkg-deb --build "${PKG_DIR}"
          shasum -a 256 "${PKG_DIR}.deb" > "${PKG_DIR}.deb.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.name }}.zip jq5.exe
          cd ../../..
          certutil -hashfile ${{ matrix.name }}.zip SHA256 > ${{ matrix.name }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            jq5-*.tar.gz
            jq5-*.tar.gz.sha256
            jq5-*.zip
            jq5-*.zip.sha256
            jq5_*.deb
            jq5_*.deb.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            jq5-*.tar.gz
            jq5-*.tar.gz.sha256
            jq5-*.zip
            jq5-*.zip.sha256
            jq5_*.deb
            jq5_*.deb.sha256
